# Verificação da aplicação web (decisão 10 da E5): a CI é o lugar onde o erro
# aparece, e a publicação de produção é outro assunto — ela sai da própria
# Cloudflare, ligada ao repositório, e não deste arquivo. A prévia por Pull
# Request é a exceção: mora aqui desde a correção registrada em
# docs/05-web/integracao-continua-e-publicacao.md#a-prévia-passou-a-ser-daqui,
# porque a integração da Cloudflare builda toda branch, tocando `web/` ou não,
# e não tinha como filtrar por caminho — só a produção respeita o filtro.
#
# Roda em todo Pull Request que toca `web/`, e de novo na `main` depois do
# merge, porque o squash merge produz um commit que ninguém verificou ainda.
name: Web

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

# Push novo na mesma branch cancela a verificação anterior: o que interessa é
# o resultado do último commit.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # A versão do Node é a mesma que a Cloudflare lê no build.
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` e não `npm install`: instala exatamente o que está no
      # package-lock.json e falha se os dois estiverem fora de sincronia.
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formatação
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      # O build por último: é o passo mais lento, e não faz sentido pagá-lo
      # quando algo mais barato já reprovou.
      - name: Build
        run: npm run build

      # E, sobre o pacote pronto, a conferência do que foi parar dentro dele:
      # ao navegador vão apenas a URL do projeto e a chave publicável (CA#6 da
      # issue #59). A chave secreta só existe no ambiente das Edge Functions.
      - name: Segredos no pacote
        run: npm run check:secrets

      # E o teto de peso: quanto o navegador baixa para abrir a aplicação
      # (issue #84). Reprovar aqui não quer dizer que a aplicação ficou lenta
      # — quer dizer que chegou a hora de decidir se o que acabou de entrar
      # precisa vir na carga inicial ou se carrega sob demanda, na rota.
      - name: Peso do pacote
        run: npm run check:size

  # A prévia do Pull Request. Só depois de `verificar` passar — não faz
  # sentido publicar o que já reprovou — e só em Pull Request: o push na
  # `main` já é produção, que a Cloudflare publica sozinha.
  previa:
    name: Prévia no Cloudflare Workers
    needs: verificar
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # As mesmas duas variáveis que o painel da Cloudflare injetava no
      # ambiente de prévia — públicas por construção (CA#6 da issue #59),
      # por isso vivem em `vars`, não em `secrets`.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # `versions upload`, não `deploy`: sobe uma versão nova sem mandar
      # tráfego de produção para ela — o mesmo comando que a Cloudflare
      # rodava para toda branch antes desta correção.
      - name: Publicar a versão de prévia
        id: previa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          saida="$(npx wrangler versions upload)"
          echo "$saida"
          url=$(echo "$saida" | grep -oP 'Version Preview Alias URL:\s*\K\S+')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Um comentário só por Pull Request, atualizado a cada push — o mesmo
      # endereço da branch, sempre no mesmo lugar, sem repetir a cada tentativa.
      - name: Comentar a prévia no Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "🔎 Prévia desta branch: ${{ steps.previa.outputs.url }}"
