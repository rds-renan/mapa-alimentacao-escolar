# Verificação das Edge Functions, em `supabase/functions/`, que rodam em Deno.
#
# Aqui mora o código de servidor do MAE: a geração do documento oficial e a
# limpeza do que venceu. O preenchimento do modelo, que nasceu como spike na
# issue #58, é o `_shared/` desta pasta — e os testes dele continuam rodando
# contra um modelo construído do zero, sem brasão e sem nome de prefeitura, que
# é o que permite verificá-los aqui.
#
# Separado do fluxo do banco de propósito: aqui não há Docker nem Supabase para
# subir, e mexer numa função não deveria custar uma reconstrução do banco.
name: Edge Functions

on:
  pull_request:
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/funcoes.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/funcoes.yml'

permissions:
  contents: read

concurrency:
  group: funcoes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Geração do documento e limpeza
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v7

      # A faixa basta: o que precisa estar fixo são as dependências, e disso
      # cuida o `deno.lock` versionado ao lado do código.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Formatação
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Tipos
        run: deno check _shared/*.ts generate-document/*.ts expire-documents/*.ts

      # `--frozen`: instala exatamente o que está no deno.lock e falha se o
      # arquivo estiver fora de sincronia com os imports.
      - name: Testes
        run: deno test --allow-read --frozen
