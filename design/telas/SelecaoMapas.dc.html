<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Geist, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #397ba1; }
    a:hover { color: #2c5f7e; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; min-height: 1080px; background: #fafafa; color: #09090b; display: flex; flex-direction: column;">

  <div style="background: #ffffff; border-bottom: 1px solid #e4e4e7; padding: 10px 8px; display: flex; align-items: center; gap: 4px;">
    <button style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: 10px; color: #52525b;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Gerar documento</div>
      <div style="font-size: 12px; color: #71717a;">Escolha os mapas que entram</div>
    </div>
  </div>

  <div style="padding: 14px 16px 110px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; gap: 8px;">
      <button style="flex-grow: 1; flex-basis: 0; min-height: 44px; border-radius: 10px; border: 1px solid #e4e4e7; background: #ffffff; color: #3f3f46; font-size: 13.5px; font-weight: 500;">Mês inteiro</button>
      <button style="flex-grow: 1; flex-basis: 0; min-height: 44px; border-radius: 10px; border: 1px solid #e4e4e7; background: #ffffff; color: #3f3f46; font-size: 13.5px; font-weight: 500;">Semana</button>
      <button style="flex-grow: 1; flex-basis: 0; min-height: 44px; border-radius: 10px; border: 1px solid #397ba1; background: #397ba1; color: #ffffff; font-size: 13.5px; font-weight: 600;">Escolher dias</button>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px; border-radius: 10px; background: #f4f4f5; color: #52525b;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
      <span style="font-size: 12.5px; line-height: 1.45;">Todos os dias escolhidos saem em um único documento, no padrão da prefeitura.</span>
    </div>

    <span style="font-size: 12.5px; font-weight: 600; color: #52525b; padding-top: 2px;">Semana 1 · 1 a 5 de setembro</span>
    <div style="background: #ffffff; border: 1px solid #e4e4e7; border-radius: 12px; display: flex; flex-direction: column;">
      <button style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; border-bottom: 1px solid #f4f4f5; background: transparent; text-align: left;">
        <span style="width: 24px; height: 24px; border-radius: 7px; background: #397ba1; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
        <span style="flex-grow: 1; font-size: 14.5px; font-weight: 500;">Segunda, 1</span>
        <span style="font-size: 12px; color: #71717a;">3 refeições</span>
      </button>
      <button style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; border-bottom: 1px solid #f4f4f5; background: transparent; text-align: left;">
        <span style="width: 24px; height: 24px; border-radius: 7px; background: #397ba1; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
        <span style="flex-grow: 1; font-size: 14.5px; font-weight: 500;">Terça, 2</span>
        <span style="font-size: 12px; color: #71717a;">3 refeições</span>
      </button>
      <button style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; border-bottom: 1px solid #f4f4f5; background: transparent; text-align: left;">
        <span style="width: 24px; height: 24px; border-radius: 7px; background: #397ba1; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
        <span style="flex-grow: 1; font-size: 14.5px; font-weight: 500;">Quarta, 3</span>
        <span style="font-size: 12px; color: #71717a;">3 refeições</span>
      </button>
      <button style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; border-bottom: 1px solid #f4f4f5; background: transparent; text-align: left;">
        <span style="width: 24px; height: 24px; border-radius: 7px; background: #397ba1; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
        <span style="flex-grow: 1; font-size: 14.5px; font-weight: 500;">Quinta, 4</span>
        <span style="font-size: 12px; color: #71717a;">3 refeições</span>
      </button>
      <button style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; background: transparent; text-align: left;">
        <span style="width: 24px; height: 24px; border-radius: 7px; background: #397ba1; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
        <span style="flex-grow: 1; font-size: 14.5px; font-weight: 500;">Sexta, 5</span>
        <span style="font-size: 12px; color: #71717a;">3 refeições</span>
      </button>
    </div>

    <span style="font-size: 12.5px; font-weight: 600; color: #52525b; padding-top: 2px;">Semana 2 · 8 a 12 de setembro</span>
    <div style="background: #ffffff; border: 1px solid #e4e4e7; border-radius: 12px; display: flex; flex-direction: column;">
      <button style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; border-bottom: 1px solid #f4f4f5; background: transparent; text-align: left;">
        <span style="width: 24px; height: 24px; border-radius: 7px; background: #397ba1; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
        <span style="flex-grow: 1; font-size: 14.5px; font-weight: 500;">Segunda, 8</span>
        <span style="font-size: 12px; color: #71717a;">3 refeições</span>
      </button>
      <button style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; border-bottom: 1px solid #f4f4f5; background: transparent; text-align: left;">
        <span style="width: 24px; height: 24px; border-radius: 7px; border: 2px solid #d4d4d8; background: #ffffff; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 14.5px; font-weight: 500;">Terça, 9</span>
        <span style="font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: #fefce8; color: #a16207; border: 1px solid #fef08a;">Pendente</span>
      </button>
      <button style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; border-bottom: 1px solid #f4f4f5; background: transparent; text-align: left;">
        <span style="width: 24px; height: 24px; border-radius: 7px; background: #397ba1; display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></span>
        <span style="flex-grow: 1; font-size: 14.5px; font-weight: 500;">Quarta, 10</span>
        <span style="font-size: 12px; color: #71717a;">Não letivo</span>
      </button>
      <button style="min-height: 56px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; background: transparent; text-align: left; opacity: 0.55;">
        <span style="width: 24px; height: 24px; border-radius: 7px; border: 2px solid #e4e4e7; background: #f4f4f5; flex-shrink: 0;"></span>
        <span style="flex-grow: 1; font-size: 14.5px; color: #a1a1aa;">Quinta, 11</span>
        <span style="font-size: 12px; color: #a1a1aa;">Sem registro</span>
      </button>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px; border-radius: 10px; background: #fefce8; border: 1px solid #fef08a; color: #854d0e;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <span style="font-size: 12.5px; line-height: 1.45;">Depois de gerar, os mapas incluídos ficam bloqueados para edição.</span>
    </div>

  </div>

  <div style="margin-top: auto; background: #ffffff; border-top: 1px solid #e4e4e7; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px;">
    <span style="font-size: 12.5px; color: #52525b; text-align: center;">7 mapas selecionados</span>
    <button style="width: 100%; min-height: 50px; border: none; border-radius: 10px; background: #397ba1; color: #ffffff; font-size: 15.5px; font-weight: 600;">Gerar documento</button>
  </div>

</div>
</x-dc>
</body>
</html>
