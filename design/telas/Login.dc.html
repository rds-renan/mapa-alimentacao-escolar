<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; font-family: Geist, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #397ba1; }
    a:hover { color: #2c5f7e; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #fafafa; color: #09090b; display: flex; flex-direction: column; padding: 32px 24px 24px;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 32px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <img src="logo.png" style="width: 88px; height: 88px;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <div style="font-size: 34px; font-weight: 600; letter-spacing: -0.02em;">MAE</div>
        <div style="font-size: 13.5px; color: #71717a;">Mapa da Alimentação Escolar</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 12.5px; font-weight: 500; color: #52525b;">E-mail</span>
        <div style="min-height: 48px; border: 1px solid #e4e4e7; border-radius: 10px; padding: 13px 14px; font-size: 15px; background: #ffffff; color: #09090b;">merendeira@dominio.com.br</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <span style="font-size: 12.5px; font-weight: 500; color: #52525b;">Senha</span>
        <div style="min-height: 48px; border: 1px solid #e4e4e7; border-radius: 10px; padding: 13px 14px; font-size: 15px; background: #ffffff; color: #09090b; letter-spacing: 3px;">••••••••</div>
      </div>
      <button style="min-height: 50px; border: none; border-radius: 10px; background: #397ba1; color: #ffffff; font-size: 15.5px; font-weight: 600; margin-top: 6px;">Entrar</button>
      <a href="#" style="font-size: 13.5px; font-weight: 500; text-align: center; padding: 12px; text-decoration: none;">Esqueci minha senha</a>
    </div>

  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 7px; color: #a1a1aa; padding-top: 16px;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    <span style="font-size: 12px;">O acesso é criado pela direção da escola</span>
  </div>

</div>
