<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: Geist, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #397ba1; }
    a:hover { color: #2c5f7e; }
    *, *::before, *::after { box-sizing: border-box; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; background: #fafafa; color: #09090b; display: flex; flex-direction: column;">

  <div style="background: #ffffff; border-bottom: 1px solid #e4e4e7; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 8px;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em;">Alteração do cardápio</div>
      <div style="font-size: 12px; color: #71717a;">Almoço · Terça, 9 de setembro</div>
    </div>
    <button style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: none; background: transparent; border-radius: 10px; color: #52525b;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
    </button>
  </div>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <span style="font-size: 12.5px; font-weight: 500; color: #52525b;">Item previsto no cardápio</span>
      <div style="min-height: 48px; border: 1px solid #e4e4e7; border-radius: 10px; padding: 13px 14px; font-size: 15px; background: #ffffff;">Frango desfiado</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <span style="font-size: 12.5px; font-weight: 500; color: #52525b;">Item servido no lugar</span>
      <div style="min-height: 48px; border: 1px solid #e4e4e7; border-radius: 10px; padding: 13px 14px; font-size: 15px; background: #ffffff;">Ovo cozido</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12.5px; font-weight: 500; color: #52525b;">Motivo</span>
      <div style="background: #ffffff; border: 1px solid #e4e4e7; border-radius: 12px; display: flex; flex-direction: column;">
        <button style="min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; border-bottom: 1px solid #f4f4f5; background: transparent; text-align: left;">
          <span style="width: 22px; height: 22px; border-radius: 999px; border: 7px solid #397ba1; background: #ffffff; flex-shrink: 0;"></span>
          <span style="font-size: 14.5px; font-weight: 500;">Falta de entrega do fornecedor</span>
        </button>
        <button style="min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; border-bottom: 1px solid #f4f4f5; background: transparent; text-align: left;">
          <span style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid #d4d4d8; background: #ffffff; flex-shrink: 0;"></span>
          <span style="font-size: 14.5px; color: #3f3f46;">Item impróprio para o uso</span>
        </button>
        <button style="min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; border-bottom: 1px solid #f4f4f5; background: transparent; text-align: left;">
          <span style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid #d4d4d8; background: #ffffff; flex-shrink: 0;"></span>
          <span style="font-size: 14.5px; color: #3f3f46;">Quantidade insuficiente</span>
        </button>
        <button style="min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: none; background: transparent; text-align: left;">
          <span style="width: 22px; height: 22px; border-radius: 999px; border: 2px solid #d4d4d8; background: #ffffff; flex-shrink: 0;"></span>
          <span style="font-size: 14.5px; color: #3f3f46;">Outro motivo</span>
        </button>
      </div>
    </div>

    <div style="display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px; border-radius: 10px; background: #f4f4f5; color: #52525b;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg>
      <span style="font-size: 12.5px; line-height: 1.45;">A troca sai no documento oficial com a justificativa, do jeito que a prefeitura pede.</span>
    </div>

  </div>

  <div style="margin-top: auto; background: #ffffff; border-top: 1px solid #e4e4e7; padding: 12px 16px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <button style="min-height: 50px; border: 1px solid #e4e4e7; border-radius: 10px; background: #ffffff; color: #09090b; font-size: 15px; font-weight: 500;">Cancelar</button>
    <button style="min-height: 50px; border: none; border-radius: 10px; background: #397ba1; color: #ffffff; font-size: 15px; font-weight: 600;">Confirmar troca</button>
  </div>

</div>
</x-dc>
</body>
</html>
